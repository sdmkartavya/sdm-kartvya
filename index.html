<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a3a6b">
<title>Library Staff Home</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--c1:#1a3a6b;--c2:#0f2547;--gold:#d4a017;--bg:#f6f1e4;--card:#fff;--ink:#1d1a14;--mute:#6b6255;--line:#e4d9bd}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:linear-gradient(160deg,var(--c1),var(--c2));color:#fff;padding:18px 16px 14px;border-bottom:4px solid var(--gold)}
.hin{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hin img{width:46px;height:46px;border-radius:10px;border:2px solid var(--gold);background:#1a3fae}
h1{font-size:19px;line-height:1.2}h1 small{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:2px}
.sw{max-width:900px;margin:12px auto 0;display:flex;gap:8px}
.sw button{flex:1;border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:600 15px inherit;font-family:inherit;padding:10px;border-radius:999px;cursor:pointer}
.sw button.on{background:var(--gold);border-color:var(--gold);color:#1b1408}
main{max-width:900px;margin:0 auto;padding:6px 16px 30px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--c1);margin:20px 2px 10px;display:flex;gap:8px;align-items:baseline}
h2 span{font-size:13px;letter-spacing:0;text-transform:none;color:var(--mute);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.t{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;text-decoration:none;color:inherit;min-height:118px;box-shadow:0 2px 6px rgba(0,0,0,.04);transition:transform .12s,box-shadow .12s}
.t:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.t:active{transform:scale(.98)}
.ic{font-size:26px;line-height:1}
.nm{font-weight:700;font-size:15.5px;color:var(--c1);margin-top:4px}
.kn{font-size:12px;color:var(--mute)}
.ds{font-size:12px;color:var(--mute);line-height:1.3}
.cp{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:#faf6ec;color:var(--mute);font-size:11px;padding:3px 7px;border-radius:7px;cursor:pointer;font-family:inherit}
.cp:hover{background:#f0e8d2}
.tip{margin-top:22px;background:#fff8e1;border:1px solid #ecd58a;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;color:#5a4300}
.tip b{color:#3b2c00}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d1a14;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="hin"><img src="icon.png" alt=""><h1>Library Staff Home &#x00B7; &#xCB8;&#xCBF;&#xCAC;&#xCCD;&#xCAC;&#xC82;&#xCA6;&#xCBF;<small id="sub">SDM College of Arts, Science and Commerce, Honavar (U.K.)</small></h1></div>
  <div class="sw"><button data-b="sdmhonavar">Honavar &#xCB9;&#xCCA;&#xCA8;&#xCCD;&#xCA8;&#xCBE;&#xCB5;&#xCB0;</button></div>
</header>
<main id="m"></main>
<div class="toast" id="toast">Link copied</div>
<script>
var D={"sdmhonavar": {"name": "Honavar", "kn": "\u0cb9\u0cca\u0ca8\u0ccd\u0ca8\u0cbe\u0cb5\u0cb0", "c1": "#0f5c63", "c2": "#0a3f44", "groups": [["Daily work", "\u0ca6\u0cc8\u0ca8\u0c82\u0ca6\u0cbf\u0ca8 \u0c95\u0cc6\u0cb2\u0cb8", [["&#x1F9D1;", "KARTAVYA", "\u0c95\u0cb0\u0ccd\u0ca4\u0cb5\u0ccd\u0caf \u0cb9\u0cbe\u0c9c\u0cb0\u0cbe\u0ca4\u0cbf", "My attendance", "https://script.google.com/macros/s/AKfycbwHPOCSCs_GxWzqTw4olfpGHRnuZ6t4XFdkTlVgtxfWpP5PkkLKsDPIr8pmKdBovZ-w/exec", "gs"], ["&#x1F4DA;", "Issue / Return", "\u0cb5\u0cbf\u0ca4\u0cb0\u0ca3\u0cc6 / \u0cb5\u0cbe\u0caa\u0cb8\u0ccd", "Issue, return, renew", "https://script.google.com/macros/s/AKfycbxvWo77brTJspEP66dkpeNrefHIirAb3s_uUuWFSHl5ChzrPxvTrx0gigGywB668dPH/exec?page=irkiosk", "gs"], ["&#x1F4F1;", "Field Kiosk", "\u0cab\u0cc0\u0cb2\u0ccd\u0ca1\u0ccd \u0c95\u0cbf\u0caf\u0ccb\u0cb8\u0ccd\u0c95\u0ccd", "Stack verify, discard, newspapers", "https://script.google.com/macros/s/AKfycbxvWo77brTJspEP66dkpeNrefHIirAb3s_uUuWFSHl5ChzrPxvTrx0gigGywB668dPH/exec?page=kiosk", "gs"], ["&#x1F6AA;", "Gate Display", "\u0c97\u0cc7\u0c9f\u0ccd \u0caa\u0ccd\u0cb0\u0ca6\u0cb0\u0ccd\u0cb6\u0ca8", "Counter PC check-in screen", "https://script.google.com/macros/s/AKfycbxvWo77brTJspEP66dkpeNrefHIirAb3s_uUuWFSHl5ChzrPxvTrx0gigGywB668dPH/exec?page=gate", "gs"]]], ["Office", "\u0c95\u0c9a\u0cc7\u0cb0\u0cbf", [["&#x2699;&#xFE0F;", "Admin Panel", "\u0c86\u0ca1\u0cb3\u0cbf\u0ca4 \u0cab\u0cb2\u0c95", "Members, cards, reports, feedback", "https://script.google.com/macros/s/AKfycbxvWo77brTJspEP66dkpeNrefHIirAb3s_uUuWFSHl5ChzrPxvTrx0gigGywB668dPH/exec", "gs"], ["&#x1FA91;", "Dead Stock", "\u0ca1\u0cc6\u0ca1\u0ccd \u0cb8\u0ccd\u0c9f\u0cbe\u0c95\u0ccd", "Property register, print", "https://script.google.com/macros/s/AKfycbxvWo77brTJspEP66dkpeNrefHIirAb3s_uUuWFSHl5ChzrPxvTrx0gigGywB668dPH/exec?page=deadstock", "gs"], ["&#x1F916;", "AI Assistant", "\u0c8e\u0c90 \u0cb8\u0cb9\u0cbe\u0caf\u0c95", "Staff app, AI search", "https://script.google.com/macros/s/AKfycbxHIlsE8uD3sa6VI-sO8IIFYynICXjsdvaYRyHZyzvyYZh6SvEii4jNq5tRxKLYbeLQRA/exec", "gs"], ["&#x1F5A8;&#xFE0F;", "Blank Form", "\u0c96\u0cbe\u0cb2\u0cbf \u0c85\u0cb0\u0ccd\u0c9c\u0cbf", "Print membership form", "https://script.google.com/macros/s/AKfycbxvWo77brTJspEP66dkpeNrefHIirAb3s_uUuWFSHl5ChzrPxvTrx0gigGywB668dPH/exec?page=regprint", "gs"]]], ["Share with readers", "\u0c93\u0ca6\u0cc1\u0c97\u0cb0\u0cbf\u0c97\u0cc6 \u0cb9\u0c82\u0c9a\u0cbf", [["&#x1F310;", "Website", "\u0cb5\u0cc6\u0cac\u0ccd\u200c\u0cb8\u0cc8\u0c9f\u0ccd", "Public library site", "../sdmhonavar/", "gh"], ["&#x2705;", "Gate Check-In", "\u0caa\u0ccd\u0cb0\u0cb5\u0cc7\u0cb6 / \u0ca8\u0cbf\u0cb0\u0ccd\u0c97\u0cae\u0ca8", "Reader check-in page", "../sdmhonavar/gate/", "gh"], ["&#x1F4DD;", "Membership Form", "\u0cb8\u0ca6\u0cb8\u0ccd\u0caf\u0ca4\u0ccd\u0cb5 \u0c85\u0cb0\u0ccd\u0c9c\u0cbf", "Online application (website)", "../sdmhonavar/#about", "gh"], ["&#x1F4D6;", "My Library", "\u0ca8\u0ca8\u0ccd\u0ca8 \u0c97\u0ccd\u0cb0\u0c82\u0ca5\u0cbe\u0cb2\u0caf", "Members log in, renew, reserve", "../sdmhonavar/my/", "gh"]]]]}};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function show(b){
  var d=D[b]; if(!d){b='sdmhonavar';d=D[b];}
  try{localStorage.setItem('staffBranch',b)}catch(e){}
  document.documentElement.style.setProperty('--c1',d.c1);document.documentElement.style.setProperty('--c2',d.c2);
  document.querySelectorAll('.sw button').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-b')===b)});
  document.getElementById('sub').textContent='SDM College of Arts, Science and Commerce, Honavar (U.K.) \u00B7 Library: '+d.name;
  var h='';
  d.groups.forEach(function(g){
    h+='<h2>'+g[0]+' <span>'+g[1]+'</span></h2><div class="grid">';
    g[2].forEach(function(t){
      h+='<a class="t" href="'+esc(t[4])+'" target="_blank" rel="noopener">'+
         (t[5]==='gs'?'<button class="cp" data-u="'+esc(t[4])+'" title="Copy link">Copy</button>':'')+
         '<span class="ic">'+t[0]+'</span><span class="nm">'+t[1]+'</span><span class="kn">'+t[2]+'</span><span class="ds">'+t[3]+'</span></a>';
    });
    h+='</div>';
  });
  h+='<div class="tip"><b>Page opens blank on a phone?</b> Tap <b>Copy</b> on that tile, open Chrome <b>&#x22EE; &#x2192; New Incognito tab</b>, paste and sign in with the library account. On the office computer every tile opens directly.<br><b>Tip:</b> Chrome &#x22EE; &#x2192; <b>Add to Home screen</b> puts this page on your phone as an app icon.</div>';
  document.getElementById('m').innerHTML=h;
}
document.querySelectorAll('.sw button').forEach(function(x){x.onclick=function(){location.hash=x.getAttribute('data-b')}});
document.addEventListener('click',function(e){
  var c=e.target.closest('.cp'); if(!c) return; e.preventDefault(); e.stopPropagation();
  var u=c.getAttribute('data-u'), t=document.getElementById('toast');
  function done(){t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1400)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(done,function(){prompt('Copy this link:',u)})}else{prompt('Copy this link:',u)}
});
function chooser(){
  document.querySelectorAll('.sw button').forEach(function(x){x.classList.remove('on')});
  document.getElementById('m').innerHTML='<h2>Choose your branch <span>&#x0CA8;&#x0CBF;&#x0CAE;&#x0CCD;&#x0CAE; &#x0CB6;&#x0CBE;&#x0C96;&#x0CC6; &#x0C86;&#x0CAF;&#x0CCD;&#x0C95;&#x0CC6; &#x0CAE;&#x0CBE;&#x0CA1;&#x0CBF;</span></h2>'+
    '<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">'+
    '<a class="t" href="#sdmhonavar" style="min-height:140px;justify-content:center;align-items:center"><span class="ic">&#x1F3DB;&#xFE0F;</span><span class="nm" style="font-size:20px">SDM Honavar</span><span class="kn">&#x0CB9;&#x0CCA;&#x0CA8;&#x0CCD;&#x0CA8;&#x0CBE;&#x0CB5;&#x0CB0;</span></a>';
}
function route(){
  var h=(location.hash||'').replace('#','');
  if(D[h]){show(h);return;}
  var saved=null; try{saved=localStorage.getItem('staffBranch')}catch(e){}
  if(D[saved]) show(saved); else show(Object.keys(D)[0]);
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
